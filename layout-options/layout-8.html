<script>
(function(){
 document.documentElement.classList.add('js');
 function themeColor(t){
  var contrast=false;
  try{contrast=matchMedia('(prefers-contrast: more)').matches}catch(e){}
  return t==='dark'?(contrast?'#14110f':'#1f1b18'):'#fffaf3';
 }
 try{
  var t=localStorage.getItem('layout-theme');
  if(t==='dark'||t==='light'){
   document.documentElement.setAttribute('data-theme',t);
   var m=document.querySelector('meta[name="color-scheme"]');
   if(m)m.setAttribute('content',t);
   var metas=document.querySelectorAll('meta[name="theme-color"]');
   for(var i=0;i<metas.length;i++){
    metas[i].setAttribute('content',themeColor(t));
    metas[i].removeAttribute('media');
   }
  }
 }catch(e){}
})();
</script>
